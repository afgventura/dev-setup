# ── tmux as a "tab manager" for Ghostty ─────────────────────────────
# All day-to-day actions are driven by Ghostty ⌘-shortcuts that send the
# prefix (C-b) sequences below — you don't need to learn the prefix.

set -g mouse on                      # click tabs, scroll, drag pane borders
set -g base-index 1                  # tabs numbered 1..9 to match ⌘1–9
set -g pane-base-index 1
set -g renumber-windows on           # closing tab 2 renumbers 3→2
# Scrollback is real here: 36 panes held 46,867 lines (avg 1302), and `footprint`
# puts a 200-col line at ~0.5-1.5 KB -- so 50000 allowed ~30 MB/pane, ~500 MB
# across 17 windows. 10000 is 5x tmux's own default and still ~200 screens of
# scrollback; pi's durable transcript is its session log + /tree, not tmux
# history. Applies to existing panes too, not just newly created ones.
set -g history-limit 10000
set -g default-terminal "tmux-256color"
# explicit index, NOT `set -a`: appending re-adds on every `source-file`, and tmux
# splits the comma list, so each reload added TWO entries and the array grew without
# bound (the live servers had reached 5 overrides / 7 features). tmux's built-in
# entries occupy terminal-overrides[0] and terminal-features[0..2].
set -s terminal-overrides[1] 'xterm-ghostty:RGB'
set -s terminal-overrides[2] 'xterm-256color:RGB'
set -g escape-time 0
set -g focus-events on
set -sg repeat-time 0
set -g set-clipboard on

# tab title follows the app's terminal title (Claude Code / Codex set one
# per task); falls back to the folder name so worktrees stay recognisable.
# A manual ⌘R rename sticks until the tab is closed.
set -g @home "$HOME"   # tmux expands $HOME in config; used by the ~ rule below
set -g automatic-rename on
# use the app's title unless it is empty, the bare hostname, or a shell's
# auto-title of the form user@host:dir — then fall back to the folder name
# Claude Code animates a braille spinner (U+2800-28FF) at the start of its title
# while working; map it to one steady glyph so the window NAME doesn't change
# per frame (a stable name = no window-renamed hook = no sidebar churn).
set -g automatic-rename-format '#{?#{&&:#{&&:#{pane_title},#{!=:#{pane_title},#{host}}},#{!:#{m:*@*:*,#{pane_title}}}},#{s/^[⠀-⣿] /⋯ /:pane_title},#{?#{==:#{pane_current_path},#{@home}},~,#{b:pane_current_path}}}'
set -g allow-rename off
set -g monitor-activity on
set -g visual-activity off

# ── tab list lives in the left sidebar (see ~/.config/tmux/) ───────
set -g status off
set-hook -g after-new-window     'run-shell -b "~/.config/tmux/sidebar-refresh.sh >/dev/null 2>&1 || true"'
set-hook -g after-select-window  'run-shell -b "~/.config/tmux/sidebar-refresh.sh >/dev/null 2>&1 || true"'
set-hook -g after-rename-window  'run-shell -b "~/.config/tmux/sidebar-refresh.sh >/dev/null 2>&1 || true"'
set-hook -g window-renamed       'run-shell -b "~/.config/tmux/sidebar-refresh.sh >/dev/null 2>&1 || true"'
# (no pane-title-changed hook: it fires per spinner frame; window-renamed
#  already fires whenever the title change actually alters the tab name)
set-hook -g window-unlinked      'run-shell -b "~/.config/tmux/sidebar-refresh.sh >/dev/null 2>&1 || true"'
set-hook -g pane-exited          'run-shell -b "~/.config/tmux/sidebar-refresh.sh >/dev/null 2>&1 || true"'
set-hook -g session-window-changed 'run-shell -b "~/.config/tmux/sidebar-refresh.sh >/dev/null 2>&1 || true"'
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour4'
set -g message-style 'bg=colour4,fg=colour15'
set -g mode-style 'bg=colour4,fg=colour15'

# ── keys (these are what the Ghostty ⌘ shortcuts send) ─────────────
bind c   new-window -c '#{pane_current_path}'
bind x   kill-pane                          # ⌘W (no confirm prompt)
bind s   choose-tree -ZwN                   # ⌘S sidebar-like picker (N = start without preview)
bind u   display-popup -E -w 80% -h 50% -T ' URLs in this tab ' "~/.config/tmux/open-url.sh '#{pane_id}'"   # ⌘⇧U
bind n   run-shell "~/.config/tmux/sidebar-nav.sh next >/dev/null 2>&1 || true"   # ⌘⇧] — sidebar order
bind p   run-shell "~/.config/tmux/sidebar-nav.sh prev >/dev/null 2>&1 || true"   # ⌘⇧[ — sidebar order
bind r   command-prompt -I '#W' 'rename-window -- "%%"'
bind |   split-window -h -c '#{pane_current_path}'
bind -   split-window -v -c '#{pane_current_path}'
bind h   select-pane -L
bind j   select-pane -D
bind k   select-pane -U
bind l   select-pane -R
bind K   clear-history \; send-keys C-l
bind R   source-file ~/.tmux.conf \; display 'tmux config reloaded'

# pass Shift+Enter etc. through unchanged (CSI-u form) so apps see them
set -s extended-keys always
set -s extended-keys-format csi-u
# explicit indices -- see the terminal-overrides note above
set -s terminal-features[3] 'xterm-ghostty:extkeys'
set -s terminal-features[4] 'tmux-256color:extkeys'

# apps inside tmux should render in truecolor (Claude Code uses softer greys)
set-environment -g COLORTERM truecolor

# tmux's own PATH (used by run-shell and inherited by new panes) had no
# /opt/homebrew/bin, so `#!/usr/bin/env bash` in ~/.config/tmux/*.sh resolved
# to /bin/bash 3.2 -- while the same script re-exec'd itself for its settle
# pass under Homebrew bash 5, because by then it had exported a PATH that did
# contain it. Two interpreters for one script. The scripts now pin
# #!/bin/bash directly; this keeps every other env lookup deterministic too.
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Applications/Ghostty.app/Contents/MacOS"
set -g default-terminal "xterm-256color"

# selections go straight to the macOS clipboard (OSC 52 does not survive the
# nested ui layer); drag-release, Enter and y in copy mode all use this
set -s copy-command 'pbcopy'
# Drag-to-select always belongs to tmux, even when the app has the mouse
# (Codex turns mouse reporting on for wheel scrolling, so by default a drag
# went to Codex and nothing was selected/copied). Wheel and clicks still go to
# the app. Release copies via copy-command (pbcopy).
bind -T root MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M'
# tmux ends a mouse selection before the cursor cell (drawn in the cursor
# colour, not copied) — copy-release.sh includes it when it's a character.
bind -T copy-mode    MouseDragEnd1Pane run-shell "~/.config/tmux/copy-release.sh '#{pane_id}' >/dev/null 2>&1 || true"
bind -T copy-mode-vi MouseDragEnd1Pane run-shell "~/.config/tmux/copy-release.sh '#{pane_id}' >/dev/null 2>&1 || true"
# If the release never arrives (button let go outside Ghostty's text grid,
# e.g. dragging below the window to scroll) the selection stays "locked" in
# copy mode and the pane looks frozen. Self-heal: the next click, or a wheel
# down at the bottom, copies what was highlighted and leaves copy mode.
bind -T copy-mode    MouseDown1Pane if -F '#{selection_present}' 'send-keys -X copy-pipe-and-cancel' 'select-pane'
bind -T copy-mode-vi MouseDown1Pane if -F '#{selection_present}' 'send-keys -X copy-pipe-and-cancel' 'select-pane'
bind -T copy-mode    WheelDownPane 'send-keys -X -N 5 scroll-down ; if -F "#{==:#{scroll_position},0}" "if -F \"#{selection_present}\" \"send-keys -X copy-pipe-and-cancel\" \"send-keys -X cancel\""'
bind -T copy-mode-vi WheelDownPane 'send-keys -X -N 5 scroll-down ; if -F "#{==:#{scroll_position},0}" "if -F \"#{selection_present}\" \"send-keys -X copy-pipe-and-cancel\" \"send-keys -X cancel\""'
bind -T copy-mode    Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode    y     send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel
