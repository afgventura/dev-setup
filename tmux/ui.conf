# Outer "ui" tmux server: just a left sidebar pane + the real "main"
# session nested on the right. Invisible chrome: no status bar, no prefix
# (so every C-b sequence from Ghostty reaches the inner tmux untouched).
set -g prefix None
set -g status off
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour8'
set -g pane-border-lines single
set -g set-clipboard on
set -g allow-passthrough on

# keep the sidebar exactly 51 columns whatever the window size
set -g window-size latest
set-hook -g client-attached 'run-shell -b "sleep 0.2; /opt/homebrew/bin/tmux -L ui resize-pane -t ui:.0 -x 51"'
set-hook -g client-resized  'run-shell -b "sleep 0.2; /opt/homebrew/bin/tmux -L ui resize-pane -t ui:.0 -x 51"'

# the sidebar pane never keeps keyboard focus
set-hook -g pane-focus-in    'if-shell -F "#{==:#{pane_index},0}" "select-pane -t ui:.1"'
set-hook -g after-select-pane 'if-shell -F "#{==:#{pane_index},0}" "select-pane -t ui:.1"'

# left click in the sidebar = switch to that tab; elsewhere = normal click
bind -T root MouseDown1Pane if-shell -F '#{==:#{pane_index},0}' \
  'run-shell -b "~/.config/tmux/sidebar-click.sh #{mouse_y}"' \
  'select-pane -t = ; send-keys -M'
# swallow the other mouse events on the sidebar so nothing reaches fzf;
# elsewhere keep tmux's stock behaviour (scroll → copy-mode, drag-select, …)
bind -T root MouseDrag1Pane   if-shell -F '#{==:#{pane_index},0}' '' 'if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -M"'
bind -T root WheelUpPane      if-shell -F '#{==:#{pane_index},0}' '' 'if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"'
bind -T root WheelDownPane    if-shell -F '#{==:#{pane_index},0}' '' 'send-keys -M'
bind -T root DoubleClick1Pane if-shell -F '#{==:#{pane_index},0}' '' 'select-pane -t = ; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel"'
bind -T root TripleClick1Pane if-shell -F '#{==:#{pane_index},0}' '' 'select-pane -t = ; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel"'

# the chrome layer is throwaway: when Ghostty (last client) goes away, exit
set-hook -g client-detached 'if-shell -F "#{==:#{session_attached},0}" kill-server'

# pass Shift+Enter etc. through unchanged (CSI-u form) so apps see them
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys,tmux-256color:extkeys'

# apps inside tmux should render in truecolor (Claude Code uses softer greys)
set-environment -g COLORTERM truecolor
set -g default-terminal "xterm-256color"
