# Outer "ui" tmux server: just a left sidebar pane + the real "main"
# session nested on the right. Invisible chrome: no status bar, no prefix
# (so every C-b sequence from Ghostty reaches the inner tmux untouched).
set -g prefix None
set -g status off
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
# explicit index, NOT `set -a`: appending re-adds on every `source-file`, and tmux
# splits the comma list, so each reload added TWO entries and the array grew without
# bound (the live servers had reached 5 overrides / 7 features). tmux's built-in
# entries occupy terminal-overrides[0] and terminal-features[0..2].
set -s terminal-overrides[1] 'xterm-ghostty:RGB'
set -s terminal-overrides[2] 'xterm-256color:RGB'
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour8'
set -g pane-border-lines single
set -g set-clipboard on
set -g allow-passthrough on

# ── pane identity ─────────────────────────────────────────────────────────
# ghostty-ui.sh records both pane ids here as it builds the throwaway "ui"
# server, and everything below matches on pane_id -- never on pane_index.
#
# This used to hardcode pane_index 0 for the sidebar. That silently rotted:
# the real indices are 1 (sidebar) and 2 (content), so every test failed and
# the sidebar stopped accepting clicks, while focus was free to settle on the
# sidebar -- an `fzf --no-input` that swallows every keystroke, which is
# indistinguishable from tmux being hung. Pane ids cannot drift like that,
# whatever pane-base-index says or whichever pane gets created first.
set -g @sidebar ""
set -g @content ""

# keep the sidebar exactly 51 columns whatever the window size
set -g window-size latest
set-hook -g client-attached 'run-shell -b "sleep 0.2; s=$(/opt/homebrew/bin/tmux -L ui show-options -gv @sidebar); [ -n \"$s\" ] && /opt/homebrew/bin/tmux -L ui resize-pane -t \"$s\" -x 51 >/dev/null 2>&1 || true"'
set-hook -g client-resized  'run-shell -b "sleep 0.2; s=$(/opt/homebrew/bin/tmux -L ui show-options -gv @sidebar); [ -n \"$s\" ] && /opt/homebrew/bin/tmux -L ui resize-pane -t \"$s\" -x 51 >/dev/null 2>&1; ~/.config/tmux/sidebar-redraw.sh >/dev/null 2>&1 || true"'
# switching Spaces / re-focusing Ghostty sometimes left the tab list blank
set-hook -g client-focus-in 'run-shell -b "~/.config/tmux/sidebar-redraw.sh >/dev/null 2>&1 || true"'

# the sidebar pane never keeps keyboard focus (see sidebar-focus.sh for why
# this cannot be an inline `select-pane -t #{@content}`)
set-hook -g pane-focus-in    'if-shell -F "#{==:#{pane_id},#{@sidebar}}" "run-shell -b ~/.config/tmux/sidebar-focus.sh"'
set-hook -g after-select-pane 'if-shell -F "#{==:#{pane_id},#{@sidebar}}" "run-shell -b ~/.config/tmux/sidebar-focus.sh"'

# left click in the sidebar = switch to that tab; elsewhere = normal click
bind -T root MouseDown1Pane if-shell -F '#{==:#{pane_id},#{@sidebar}}' \
  'run-shell -b "~/.config/tmux/sidebar-click.sh #{mouse_y} >/dev/null 2>&1 || true"' \
  'select-pane -t = ; send-keys -M'
# swallow the other mouse events on the sidebar so nothing reaches fzf;
# elsewhere keep tmux's stock behaviour (scroll → copy-mode, drag-select, …)
bind -T root MouseDrag1Pane   if-shell -F '#{==:#{pane_id},#{@sidebar}}' '' 'if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -M"'
# The drag *end* must be bound too: an unbound mouse key is written to the
# pane straight from the input parser, while bound ones (the drag events above)
# go through the command queue — so the release could overtake the last drag
# event and the inner tmux copied everything except the last character.
bind -T root MouseDragEnd1Pane if-shell -F '#{==:#{pane_id},#{@sidebar}}' '' 'send-keys -M'
bind -T root MouseUp1Pane      if-shell -F '#{==:#{pane_id},#{@sidebar}}' '' 'send-keys -M'
# The outer pane is only a chrome wrapper around the nested main tmux.  It has
# no application history of its own, so entering outer copy-mode here can
# scroll the wrapper and clip the nested full-screen UI at the top.  Always
# forward the wheel; the inner tmux/app owns scrolling and copy-mode.
bind -T root WheelUpPane      if-shell -F '#{==:#{pane_id},#{@sidebar}}' '' 'send-keys -M'
bind -T root WheelDownPane    if-shell -F '#{==:#{pane_id},#{@sidebar}}' '' 'send-keys -M'
bind -T root DoubleClick1Pane if-shell -F '#{==:#{pane_id},#{@sidebar}}' '' 'select-pane -t = ; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel"'
bind -T root TripleClick1Pane if-shell -F '#{==:#{pane_id},#{@sidebar}}' '' 'select-pane -t = ; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel"'

# the chrome layer is throwaway: when Ghostty (last client) goes away, exit
set-hook -g client-detached 'if-shell -F "#{==:#{session_attached},0}" kill-server'

# pass Shift+Enter etc. through unchanged (CSI-u form) so apps see them
set -s extended-keys always
set -s extended-keys-format csi-u
# explicit indices -- see the terminal-overrides note above
set -s terminal-features[3] 'xterm-ghostty:extkeys'
set -s terminal-features[4] 'tmux-256color:extkeys'

# apps inside tmux should render in truecolor (Claude Code uses softer greys)
set-environment -g COLORTERM truecolor
set -g default-terminal "xterm-256color"
