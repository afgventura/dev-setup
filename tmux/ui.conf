# Outer "ui" tmux server: just a left sidebar pane + the real "main"
# session nested on the right. Invisible chrome: no status bar, no prefix
# (so every C-b sequence from Ghostty reaches the inner tmux untouched).
set -g prefix None
set -g status off
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
# explicit index, NOT `set -a`: appending re-adds on every `source-file`, and tmux
# splits the comma list, so each reload added TWO entries and the array grew without
# bound (the live servers had reached 5 overrides / 7 features). tmux's built-in
# entries occupy terminal-overrides[0] and terminal-features[0..2].
set -s terminal-overrides[1] 'xterm-ghostty:RGB'
set -s terminal-overrides[2] 'xterm-256color:RGB'
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour8'
set -g pane-border-lines single
set -g set-clipboard on
set -g allow-passthrough on

# ── pane identity ─────────────────────────────────────────────────────────
# The layout is [sidebar | content]: the sidebar is the pane at column 0 and the
# content is the only other pane. Everything below matches on that geometry --
# never on a recorded pane id or pane index, so no reload, respawn or reused
# server can invalidate a guard. The `window_panes > 1` half covers the failure
# in the other direction: if the sidebar pane is ever gone, the content pane is
# the pane at column 0 too, and a lone pane must not be treated as the sidebar
# (the redraw would then resize your terminal down to the sidebar width, and
# clicks would start switching tabs by row position).
#
# Both earlier versions of this file broke the sidebar the same way: one
# hardcoded pane_index 0 while the live panes were 1 and 2; the next compared
# pane_id against @sidebar/@content, which THIS FILE then blanked on every load
# (install.sh re-sources it into the live server: `tmux -L ui source-file
# ui.conf`). Each failure looked like a dead keyboard: the click missed its
# branch, ran the "else" (`select-pane -t =`) and focused the sidebar's
# `fzf --no-input`, which silently eats every keystroke. The sidebar still
# rendered, so it read as tmux being hung; clicking the content pane revived it.
# @sidebar/@content are still recorded (ghostty-ui.sh calls sidebar-ids.sh, and
# sidebar-redraw.sh re-records them after a resize) for scripts and for humans,
# but no guard reads them.
#
# Sidebar width is a single knob: change it here. sidebar-list.sh (row padding
# and truncation), sidebar-redraw.sh (the pane resize) and ghostty-ui.sh (the
# initial split) all read @sidebar_width.
set -g @sidebar_width 72
set -g window-size latest
# Reassert the layout on (re)attach and on resize: sidebar-redraw.sh re-records
# the ids, puts the sidebar back to @sidebar_width and repaints. The width used
# to be enforced by an inline `[ -n "$s" ]` right here, but tmux expanded $s
# while parsing the config, so that hook had always been dead code.
set-hook -g client-attached 'run-shell -b ~/.config/tmux/sidebar-redraw.sh >/dev/null 2>&1 || true'
set-hook -g client-resized  'run-shell -b ~/.config/tmux/sidebar-redraw.sh >/dev/null 2>&1 || true'
set-hook -g client-focus-in 'run-shell -b "~/.config/tmux/sidebar-redraw.sh >/dev/null 2>&1 || true"'

# The sidebar is the pane at column 0 -- that geometry test is the guard every
# mouse binding and focus hook uses. The sidebar pane never keeps keyboard
# focus; see sidebar-focus.sh for why the redirect cannot be an inline
# `select-pane -t #{@content}` and what happens when it does not run.
set-hook -g pane-focus-in    'if-shell -F "#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}" "run-shell -b ~/.config/tmux/sidebar-focus.sh"'
set-hook -g after-select-pane 'if-shell -F "#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}" "run-shell -b ~/.config/tmux/sidebar-focus.sh"'

# left click in the sidebar = switch to that tab; elsewhere = normal click
bind -T root MouseDown1Pane if-shell -F '#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}' \
  'run-shell -b "~/.config/tmux/sidebar-click.sh #{mouse_y} >/dev/null 2>&1 || true"' \
  'select-pane -t = ; send-keys -M'
# swallow the other mouse events on the sidebar so nothing reaches fzf;
# elsewhere keep tmux's stock behaviour (scroll → copy-mode, drag-select, …)
bind -T root MouseDrag1Pane   if-shell -F '#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}' '' 'if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -M"'
# The drag *end* must be bound too: an unbound mouse key is written to the
# pane straight from the input parser, while bound ones (the drag events above)
# go through the command queue — so the release could overtake the last drag
# event and the inner tmux copied everything except the last character.
bind -T root MouseDragEnd1Pane if-shell -F '#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}' '' 'send-keys -M'
bind -T root MouseUp1Pane      if-shell -F '#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}' '' 'send-keys -M'
# The outer pane is only a chrome wrapper around the nested main tmux.  It has
# no application history of its own, so entering outer copy-mode here can
# scroll the wrapper and clip the nested full-screen UI at the top.  Always
# forward the wheel; the inner tmux/app owns scrolling and copy-mode.
bind -T root WheelUpPane      if-shell -F '#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}' '' 'send-keys -M'
bind -T root WheelDownPane    if-shell -F '#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}' '' 'send-keys -M'
bind -T root DoubleClick1Pane if-shell -F '#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}' '' 'select-pane -t = ; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel"'
bind -T root TripleClick1Pane if-shell -F '#{&&:#{==:#{pane_left},0},#{>:#{window_panes},1}}' '' 'select-pane -t = ; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel"'

# the chrome layer is throwaway: when Ghostty (last client) goes away, exit
set-hook -g client-detached 'if-shell -F "#{==:#{session_attached},0}" kill-server'

# pass Shift+Enter etc. through unchanged (CSI-u form) so apps see them
set -s extended-keys always
set -s extended-keys-format csi-u
# explicit indices -- see the terminal-overrides note above
set -s terminal-features[3] 'xterm-ghostty:extkeys'
set -s terminal-features[4] 'tmux-256color:extkeys'

# apps inside tmux should render in truecolor (Claude Code uses softer greys)
set-environment -g COLORTERM truecolor
set -g default-terminal "xterm-256color"
